    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-in-out; }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .animate-zoomIn { animation: zoomIn 0.2s ease-out; }

        @keyframes pulse-border {
            0%, 100% { border-color: rgba(59, 130, 246, 0.5); }
            50% { border-color: rgba(59, 130, 246, 1); }
        }
        .config-zone {
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        .config-zone:hover {
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
        }
        .config-zone::before {
            content: '';
            position: absolute;
            inset: -2px;
            border: 2px dashed transparent;
            border-radius: inherit;
            pointer-events: none;
            transition: border-color 0.2s;
        }
        .config-zone:hover::before {
            border-color: #3b82f6;
            animation: pulse-border 1.5s infinite;
        }

        /* Resizer */
        .resizer {
            width: 4px;
            cursor: col-resize;
            background: transparent;
            transition: background 0.2s;
        }
        .resizer:hover { background: #3b82f6; }

        /* Inherited Badge */
        .inherited-badge {
            background: linear-gradient(135deg, #e0f2fe 0%, #dbeafe 100%);
            border: 1px solid #93c5fd;
            color: #1d4ed8;
        }

        /* Config Indicator */
        .config-indicator {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
            z-index: 10;
        }
    </style>

            try {
                const iconDef = window.lucide.icons[name];
                const svgElement = window.lucide.createElement(iconDef);
                svgElement.setAttribute('width', size);
                svgElement.setAttribute('height', size);
                const baseClass = `lucide lucide-${name}`;
                svgElement.setAttribute('class', className ? `${baseClass} ${className}` : baseClass);
                return <span
                    dangerouslySetInnerHTML={{ __html: svgElement.outerHTML }}

            const [rightWidth, setRightWidth] = useState(25);

                const keys = path.split('.');
                let current = newConfig;
                for (let i = 0; i < keys.length - 1; i++) {
                    current = current[keys[i]];

                setConfig(newConfig);
                setHasUnsavedChanges(true);

                                onUpdateTasks={updateTasks}
                                onPreviewResource={(resource) => setPreviewingResource(resource)}
                                onEditTask={(taskId) => setEditingTaskId(taskId)}

                        </div>

                        <Resizer onResize={(delta) => setLeftWidth(Math.max(18, Math.min(35, leftWidth + delta)))} />

                        {/* 中间：交互策略 */}

                                activeTab={centerTab}
                                onTabChange={setCenterTab}
                                onUpdateConfig={updateConfig}
                            />
                        </div>

                        <Resizer onResize={(delta) => setRightWidth(Math.max(18, Math.min(35, rightWidth - delta)))} />

                        {/* 右侧：产出与监控 */}

        // --- Resizer Component ---
        function Resizer({ onResize }) {
            const [isResizing, setIsResizing] = useState(false);
            const startXRef = useRef(0);

            const handleMouseDown = (e) => {
                setIsResizing(true);
                startXRef.current = e.clientX;
                document.body.style.cursor = 'col-resize';
            };

            useEffect(() => {
                if (!isResizing) return;

                const handleMouseMove = (e) => {
                    const delta = ((e.clientX - startXRef.current) / window.innerWidth) * 100;
                    onResize(delta);
                    startXRef.current = e.clientX;
                };

                const handleMouseUp = () => {
                    setIsResizing(false);
                    document.body.style.cursor = 'default';
                };

                document.addEventListener('mousemove', handleMouseMove);
                document.addEventListener('mouseup', handleMouseUp);

                return () => {
                    document.removeEventListener('mousemove', handleMouseMove);
                    document.removeEventListener('mouseup', handleMouseUp);
                };
            }, [isResizing]);

            return (
                <div
                    className={`resizer ${isResizing ? 'bg-blue-500' : ''}`}
                    onMouseDown={handleMouseDown}
                />
            );
        }

                if (!newKpSubject || !newKpPoint) return;

                    subject: newKpSubject,

                    source: newKpIsCustom ? 'custom' : 'library'
                };
                setLocalConfig({
                    ...localConfig,
                    knowledgePoints: [...localConfig.knowledgePoints, newKp]
                });

        // --- Resources Modal (增强版：本地上传/知识库选择 + 预览 + 拖拽排序) ---

            const [localResources, setLocalResources] = useState([...resources]);

            // 添加资源（从知识库）
            const addFromLibrary = (resource) => {
                setLocalResources([...localResources, {
                    ...resource,
                    id: `r_${Date.now()}`,
                    source: 'library'
                }]);
                setShowLibraryModal(false);
                setShowAddMenu(false);
            };

            // 添加资源（本地上传 - 模拟）
            const addFromLocal = () => {
                const newResource = {
                    id: `r_${Date.now()}`,
                    title: '本地上传的资源',
                    type: 'pdf',
                    icon: 'FileText',
                    color: 'blue',
                    pages: 1,
                    source: 'local'
                };
                setLocalResources([...localResources, newResource]);
                setShowAddMenu(false);
            };

            // 删除资源
            const removeResource = (id) => {
                setLocalResources(localResources.filter(r => r.id !== id));
            };

            // 更新资源
            const updateResource = (id, field, value) => {
                setLocalResources(localResources.map(r => r.id === id ? { ...r, [field]: value } : r));
            };

            // 预览资源
            const previewResourceHandler = (resource) => {
                setPreviewResource(resource);
                setShowPreviewModal(true);
            };

            // 拖拽开始
            const handleDragStart = (index) => {
                setDraggedIndex(index);
            };

            // 拖拽到目标位置
            const handleDragOver = (e, index) => {
                e.preventDefault();
                if (draggedIndex === null || draggedIndex === index) return;

                const newResources = [...localResources];
                const draggedItem = newResources[draggedIndex];
                newResources.splice(draggedIndex, 1);
                newResources.splice(index, 0, draggedItem);

                setLocalResources(newResources);
                setDraggedIndex(index);
            };

            // 拖拽结束
            const handleDragEnd = () => {
                setDraggedIndex(null);

                                    教学资源配置

                                        draggable
                                        onDragStart={() => handleDragStart(idx)}
                                        onDragOver={(e) => handleDragOver(e, idx)}
                                        onDragEnd={handleDragEnd}
                                        className={`group p-4 bg-slate-50 rounded-xl border-2 transition-all cursor-move hover:shadow-md ${
                                            draggedIndex === idx ? 'border-blue-400 bg-blue-50 opacity-50' : 'border-slate-200 hover:border-blue-300'
                                        }`}
                                    >
                                        <div className="flex items-start gap-3">
                                            {/* 拖拽手柄 */}
                                            <div className="mt-1 text-slate-300 group-hover:text-slate-500 transition-colors">
                                                <Icon name="GripVertical" size={18} />
                                            </div>

                                            {/* 资源图标 */}
                                            <div
                                                onClick={() => previewResourceHandler(resource)}
                                                className={`w-12 h-12 rounded-lg bg-${resource.color}-100 flex items-center justify-center cursor-pointer hover:scale-105 transition-transform`}
                                            >
                                                <Icon name={resource.icon} size={20} className={`text-${resource.color}-600`} />
                                            </div>

                                            {/* 资源信息 */}
                                            <div
                                                onClick={() => previewResourceHandler(resource)}
                                                className="flex-1 cursor-pointer"
                                            >
                                                {editingId === resource.id ? (
                                                    <input
                                                        type="text"
                                                        value={resource.title}
                                                        onChange={(e) => updateResource(resource.id, 'title', e.target.value)}
                                                        onBlur={() => setEditingId(null)}
                                                        className="w-full bg-white border border-blue-300 rounded-lg px-3 py-1.5 text-sm text-slate-700 focus:ring-2 focus:ring-blue-500 outline-none"

                                                        onClick={(e) => e.stopPropagation()}
                                                    />

                                                    <p className="text-sm font-medium text-slate-700 hover:text-blue-600 transition-colors">{resource.title}</p>
                                                )}
                                                <div className="flex items-center gap-2 mt-1">
                                                    <span className="text-xs text-slate-500">
                                                        {resource.duration || (resource.pages ? `${resource.pages}页` : resource.url ? '网页链接' : '文件')}

                                                    {resource.source === 'library' && (
                                                        <span className="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded">知识库</span>

                                                        <span className="text-xs bg-blue-100 text-blue-600 px-2 py-0.5 rounded">本地上传</span>
                                                    )}
                                                </div>
                                            </div>

                                            {/* 操作菜单（三点） */}
                                            <div className="relative group/menu">
                                                <button
                                                    className="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-200 rounded-lg transition-all"
                                                    onClick={(e) => e.stopPropagation()}
                                                >
                                                    <Icon name="MoreVertical" size={16} />
                                                </button>

                                                {/* 下拉菜单 */}

                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); previewResourceHandler(resource); }}
                                                        className="w-full px-3 py-2 text-left text-sm text-slate-700 hover:bg-blue-50 flex items-center gap-2"
                                                    >
                                                        <Icon name="Eye" size={14} className="text-blue-600" />
                                                        预览
                                                    </button>
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); setEditingId(resource.id); }}
                                                        className="w-full px-3 py-2 text-left text-sm text-slate-700 hover:bg-amber-50 flex items-center gap-2"
                                                    >
                                                        <Icon name="Pencil" size={14} className="text-amber-600" />
                                                        编辑
                                                    </button>
                                                    <button
                                                        onClick={(e) => { e.stopPropagation(); removeResource(resource.id); }}
                                                        className="w-full px-3 py-2 text-left text-sm text-red-600 hover:bg-red-50 flex items-center gap-2"
                                                    >
                                                        <Icon name="Trash2" size={14} />
                                                        删除
                                                    </button>
                                                </div>
                                            </div>
                                        </div>

                                        {resource.description && (
                                            <p className="text-xs text-slate-500 mt-2 ml-[52px]">{resource.description}</p>
                                        )}
                                    </div>
                                ))}

                                {/* 添加资源按钮 */}
                                <div className="relative">
                                    <button
                                        onClick={() => setShowAddMenu(!showAddMenu)}
                                        className="w-full py-4 border-2 border-dashed border-slate-300 rounded-xl text-slate-500 hover:border-blue-400 hover:text-blue-600 hover:bg-blue-50 transition-all flex items-center justify-center gap-2 font-medium"
                                    >
                                        <Icon name="Plus" size={18} />
                                        添加资源
                                    </button>

                                    {/* 添加资源选择菜单 */}
                                    {showAddMenu && (
                                        <div className="absolute left-1/2 -translate-x-1/2 top-full mt-2 w-72 bg-white rounded-xl shadow-2xl border border-slate-200 p-3 space-y-2 z-20 animate-fadeIn">
                                            <button

                                            >
                                                <div className="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">

                                                </div>
                                                <div className="text-left">
                                                    <p className="font-bold">本地上传</p>

                                            </button>
                                            <button

                                                    <p className="text-xs text-emerald-100">从平台资源库中选择</p>
                                                </div>
                                            </button>
                                        </div>
                                    )}
                                </div>

                                {/* 提示信息 */}

                                            <p>• 拖拽卡片可调整展示顺序</p>
                                            <p>• 点击三点图标进行编辑/删除</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="p-4 border-t border-slate-200 flex justify-end gap-3 bg-slate-50">
                                <button onClick={onClose} className="px-4 py-2 text-slate-600 hover:text-slate-800">取消</button>
                                <button onClick={() => onSave(localResources)} className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium shadow-sm">保存</button>
                            </div>
                        </div>

            const [localTasks, setLocalTasks] = useState([...tasks]);
            const [activeTaskId, setActiveTaskId] = useState(tasks[0]?.id || null);
            const [isGenerating, setIsGenerating] = useState(false);
            const [showAIGenConfig, setShowAIGenConfig] = useState(false);
            const [aiGenConfig, setAIGenConfig] = useState({
                questionCount: 3,
                questionTypes: ['choice'],
                userPrompt: ''
            });

            const activeTask = localTasks.find(t => t.id === activeTaskId);

            const addTask = (type) => {
                const newTask = {
                    id: `t_${Date.now()}`,
                    title: type === 'quiz' ? '新测验' : '新作业',
                    type,
                    status: 'required',
                    passScore: 60,
                    questions: type === 'quiz' ? [] : undefined,
                    teacherHint: type === 'assignment' ? '' : undefined,
                    wordLimit: type === 'assignment' ? { min: 50, max: 300 } : undefined,
                    // AI批改配置（仅作业）
                    aiGrading: type === 'assignment' ? {
                        enabled: false,
                        agentId: 'agent_default',
                        customPrompt: '',
                        gradingCriteria: ''
                    } : undefined,
                };
                setLocalTasks([...localTasks, newTask]);
                setActiveTaskId(newTask.id);
            };

            const removeTask = (id) => {
                const newTasks = localTasks.filter(t => t.id !== id);
                setLocalTasks(newTasks);
                if (activeTaskId === id) {
                    setActiveTaskId(newTasks[0]?.id || null);
                }
            };

            const updateTask = (id, field, value) => {
                setLocalTasks(localTasks.map(t => t.id === id ? { ...t, [field]: value } : t));
            };

            // AI生成题目（使用配置）
            const generateQuestions = async () => {
                if (!activeTask || activeTask.type !== 'quiz') return;
                setIsGenerating(true);
                setShowAIGenConfig(false);

                // 模拟AI生成（根据配置生成对应数量和类型的题目）
                await new Promise(resolve => setTimeout(resolve, 1500));

                const generatedQuestions = [];
                const types = aiGenConfig.questionTypes.length > 0 ? aiGenConfig.questionTypes : ['choice'];

                for (let i = 0; i < aiGenConfig.questionCount; i++) {
                    const questionType = types[i % types.length];
                    if (questionType === 'choice') {
                        generatedQuestions.push({
                            id: `q_${Date.now()}_${i}`,
                            type: 'choice',
                            content: `AI生成的选择题 ${i + 1}`,
                            options: ['选项A', '选项B', '选项C', '选项D'],
                            answer: 0,
                            aiGenerated: true
                        });
                    } else if (questionType === 'fillblank') {
                        generatedQuestions.push({
                            id: `q_${Date.now()}_${i}`,
                            type: 'fillblank',
                            content: `AI生成的填空题 ${i + 1}：______`,
                            answer: '答案',
                            aiGenerated: true
                        });
                    } else if (questionType === 'truefalse') {
                        generatedQuestions.push({
                            id: `q_${Date.now()}_${i}`,
                            type: 'truefalse',
                            content: `AI生成的判断题 ${i + 1}`,
                            answer: true,
                            aiGenerated: true
                        });
                    } else if (questionType === 'shortanswer') {
                        generatedQuestions.push({
                            id: `q_${Date.now()}_${i}`,
                            type: 'shortanswer',
                            content: `AI生成的简答题 ${i + 1}`,
                            answer: '参考答案',
                            aiGenerated: true
                        });
                    }
                }

                updateTask(activeTaskId, 'questions', generatedQuestions);
                updateTask(activeTaskId, 'generatedAt', new Date().toLocaleString('zh-CN'));
                updateTask(activeTaskId, 'aiGenPrompt', aiGenConfig.userPrompt);
                setIsGenerating(false);
            };

            // 更新单个题目
            const updateQuestion = (questionId, field, value) => {
                if (!activeTask) return;
                const newQuestions = activeTask.questions.map(q =>
                    q.id === questionId ? { ...q, [field]: value, aiGenerated: false } : q
                );
                updateTask(activeTaskId, 'questions', newQuestions);
            };

            // 删除题目
            const removeQuestion = (questionId) => {
                if (!activeTask) return;
                const newQuestions = activeTask.questions.filter(q => q.id !== questionId);
                updateTask(activeTaskId, 'questions', newQuestions);
            };

            // 添加题目
            const addQuestion = (type) => {
                if (!activeTask) return;
                const newQuestion = {
                    id: `q_${Date.now()}`,
                    type,
                    content: '',
                    options: type === 'choice' ? ['选项A', '选项B', '选项C'] : undefined,
                    answer: type === 'choice' ? 0 : '',
                    aiGenerated: false,
                };
                updateTask(activeTaskId, 'questions', [...(activeTask.questions || []), newQuestion]);
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white w-[900px] max-h-[85vh] rounded-2xl shadow-2xl overflow-hidden animate-zoomIn" onClick={e => e.stopPropagation()}>
                        <div className="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-5">
                            <h2 className="text-lg font-bold flex items-center gap-2">
                                <Icon name="ClipboardCheck" size={20} />
                                学习任务配置
                            </h2>
                            <p className="text-amber-100 text-sm mt-1">设置测验题目、作业要求，支持AI智能生成</p>
                        </div>

                        <div className="flex h-[60vh]">
                            {/* 左侧任务列表 */}
                            <div className="w-64 border-r border-slate-200 bg-slate-50 overflow-y-auto">
                                <div className="p-3 space-y-2">
                                    {localTasks.map((task) => (
                                        <div
                                            key={task.id}
                                            onClick={() => setActiveTaskId(task.id)}
                                            className={`p-3 rounded-lg cursor-pointer transition-all ${
                                                activeTaskId === task.id
                                                    ? 'bg-white border-2 border-amber-400 shadow-sm'
                                                    : 'bg-white border border-slate-200 hover:border-amber-300'
                                            }`}
                                        >
                                            <div className="flex items-center gap-2">
                                                <Icon name={task.type === 'quiz' ? 'Zap' : 'FileEdit'} size={14} className={task.type === 'quiz' ? 'text-green-600' : 'text-blue-600'} />
                                                <span className="text-sm font-medium text-slate-700 truncate flex-1">{task.title}</span>
                                                <button
                                                    onClick={(e) => { e.stopPropagation(); removeTask(task.id); }}
                                                    className="p-1 text-slate-400 hover:text-red-500"
                                                >
                                                    <Icon name="X" size={12} />
                                                </button>
                                            </div>
                                            {task.type === 'quiz' && task.questions && (
                                                <p className="text-xs text-slate-400 mt-1">{task.questions.length} 道题</p>
                                            )}
                                        </div>
                                    ))}
                                </div>
                                <div className="p-3 border-t border-slate-200 space-y-2">
                                    <button
                                        onClick={() => addTask('quiz')}
                                        className="w-full py-2 border border-dashed border-green-300 rounded-lg text-green-600 hover:bg-green-50 text-xs flex items-center justify-center gap-1"
                                    >
                                        <Icon name="Zap" size={12} />
                                        添加测验
                                    </button>
                                    <button
                                        onClick={() => addTask('assignment')}
                                        className="w-full py-2 border border-dashed border-blue-300 rounded-lg text-blue-600 hover:bg-blue-50 text-xs flex items-center justify-center gap-1"
                                    >
                                        <Icon name="FileEdit" size={12} />
                                        添加作业
                                    </button>
                                </div>
                            </div>

                            {/* 右侧任务详情 */}
                            <div className="flex-1 overflow-y-auto p-4">
                                {activeTask ? (
                                    <div className="space-y-4">
                                        {/* 基本信息 */}
                                        <div className="grid grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-medium text-slate-600 mb-1">任务标题</label>
                                                <input
                                                    type="text"
                                                    value={activeTask.title}
                                                    onChange={(e) => updateTask(activeTaskId, 'title', e.target.value)}
                                                    className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none"
                                                />
                                            </div>
                                            <div className="flex items-end gap-3">
                                                <label className="flex items-center gap-2 cursor-pointer">
                                                    <input
                                                        type="checkbox"
                                                        checked={activeTask.status === 'required'}
                                                        onChange={(e) => updateTask(activeTaskId, 'status', e.target.checked ? 'required' : 'optional')}
                                                        className="w-4 h-4 text-red-600 rounded"
                                                    />
                                                    <span className="text-sm text-slate-600">必修任务</span>
                                                </label>
                                                {activeTask.type === 'quiz' && (
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-xs text-slate-500">及格分:</span>
                                                        <input
                                                            type="number"
                                                            value={activeTask.passScore}
                                                            onChange={(e) => updateTask(activeTaskId, 'passScore', parseInt(e.target.value))}
                                                            className="w-16 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-center"
                                                        />
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* 测验题目 */}
                                        {activeTask.type === 'quiz' && (
                                            <div className="space-y-3">
                                                <div className="flex items-center justify-between">
                                                    <h3 className="text-sm font-bold text-slate-700 flex items-center gap-2">
                                                        <Icon name="ListChecks" size={14} />
                                                        测验题目
                                                        {activeTask.questions?.length > 0 && (
                                                            <span className="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded">{activeTask.questions.length} 题</span>
                                                        )}
                                                    </h3>
                                                    <div className="flex items-center gap-2">
                                                        <button
                                                            onClick={() => setShowAIGenConfig(!showAIGenConfig)}
                                                            className="flex items-center gap-1 px-3 py-1.5 bg-gradient-to-r from-purple-500 to-indigo-500 text-white rounded-lg text-xs font-medium hover:from-purple-600 hover:to-indigo-600 shadow-sm"
                                                        >
                                                            <Icon name="Settings" size={12} />
                                                            AI出题配置
                                                        </button>
                                                    </div>
                                                </div>

                                                {/* AI生成配置面板 */}
                                                {showAIGenConfig && (
                                                    <div className="p-4 bg-purple-50 rounded-xl border border-purple-200 space-y-3">
                                                        <h4 className="text-sm font-bold text-purple-700 flex items-center gap-2">
                                                            <Icon name="Sparkles" size={14} />
                                                            AI生成配置
                                                        </h4>

                                                        <div>
                                                            <label className="block text-xs font-medium text-slate-600 mb-2">题目数量</label>
                                                            <div className="flex gap-2">
                                                                {[3, 5, 10].map(count => (
                                                                    <button
                                                                        key={count}
                                                                        onClick={() => setAIGenConfig({...aiGenConfig, questionCount: count})}
                                                                        className={`px-3 py-1.5 rounded-lg text-sm font-medium transition-colors ${
                                                                            aiGenConfig.questionCount === count
                                                                                ? 'bg-purple-600 text-white'
                                                                                : 'bg-white text-slate-600 hover:bg-purple-100'
                                                                        }`}
                                                                    >
                                                                        {count}题
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <label className="block text-xs font-medium text-slate-600 mb-2">题型选择（可多选）</label>
                                                            <div className="grid grid-cols-2 gap-2">
                                                                {[
                                                                    { id: 'choice', label: '单选题', icon: 'Circle' },
                                                                    { id: 'fillblank', label: '填空题', icon: 'FileEdit' },
                                                                    { id: 'truefalse', label: '判断题', icon: 'CheckCircle' },
                                                                    { id: 'shortanswer', label: '简答题', icon: 'FileText' }
                                                                ].map(type => (
                                                                    <label
                                                                        key={type.id}
                                                                        className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer transition-colors ${
                                                                            aiGenConfig.questionTypes.includes(type.id)
                                                                                ? 'bg-purple-600 text-white'
                                                                                : 'bg-white text-slate-600 hover:bg-purple-100'
                                                                        }`}
                                                                    >
                                                                        <input
                                                                            type="checkbox"
                                                                            checked={aiGenConfig.questionTypes.includes(type.id)}
                                                                            onChange={(e) => {
                                                                                if (e.target.checked) {
                                                                                    setAIGenConfig({...aiGenConfig, questionTypes: [...aiGenConfig.questionTypes, type.id]});
                                                                                } else {
                                                                                    setAIGenConfig({...aiGenConfig, questionTypes: aiGenConfig.questionTypes.filter(t => t !== type.id)});
                                                                                }
                                                                            }}
                                                                            className="hidden"
                                                                        />
                                                                        <Icon name={type.icon} size={14} />
                                                                        <span className="text-xs font-medium">{type.label}</span>
                                                                    </label>
                                                                ))}
                                                            </div>
                                                        </div>

                                                        <div>
                                                            <label className="block text-xs font-medium text-slate-600 mb-2">User Prompt（可选）</label>
                                                            <textarea
                                                                value={aiGenConfig.userPrompt}
                                                                onChange={(e) => setAIGenConfig({...aiGenConfig, userPrompt: e.target.value})}
                                                                placeholder="例如：题目难度适中，侧重理解水循环的实际应用..."
                                                                className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs focus:ring-2 focus:ring-purple-500 outline-none resize-none"
                                                                rows={2}
                                                            />
                                                        </div>

                                                        <button
                                                            onClick={generateQuestions}
                                                            disabled={isGenerating || aiGenConfig.questionTypes.length === 0}
                                                            className="w-full flex items-center justify-center gap-2 px-4 py-2 bg-purple-600 text-white rounded-lg text-sm font-medium hover:bg-purple-700 disabled:opacity-50 disabled:cursor-not-allowed"
                                                        >
                                                            {isGenerating ? (
                                                                <>
                                                                    <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                                                    生成中...
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <Icon name="Sparkles" size={14} />
                                                                    开始生成
                                                                </>
                                                            )}
                                                        </button>
                                                    </div>
                                                )}

                                                {activeTask.generatedAt && (
                                                    <div className="text-xs text-slate-400 flex items-center gap-1">
                                                        <Icon name="Clock" size={10} />
                                                        AI生成于 {activeTask.generatedAt}
                                                        {activeTask.aiGenPrompt && <span className="ml-2 text-purple-500">（已使用自定义Prompt）</span>}
                                                    </div>
                                                )}

                                                {/* 题目列表 */}
                                                <div className="space-y-3">
                                                    {(activeTask.questions || []).map((question, qIdx) => (
                                                        <div key={question.id} className={`p-4 rounded-xl border ${question.aiGenerated ? 'bg-purple-50/50 border-purple-200' : 'bg-white border-slate-200'}`}>
                                                            <div className="flex items-start justify-between mb-2">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="w-6 h-6 rounded-full bg-slate-200 text-slate-600 text-xs font-bold flex items-center justify-center">{qIdx + 1}</span>
                                                                    <span className={`text-xs px-2 py-0.5 rounded ${
                                                                        question.type === 'choice' ? 'bg-blue-100 text-blue-600' :
                                                                        question.type === 'fillblank' ? 'bg-amber-100 text-amber-600' :
                                                                        question.type === 'truefalse' ? 'bg-green-100 text-green-600' :
                                                                        'bg-indigo-100 text-indigo-600'
                                                                    }`}>
                                                                        {question.type === 'choice' ? '选择题' :
                                                                         question.type === 'fillblank' ? '填空题' :
                                                                         question.type === 'truefalse' ? '判断题' : '简答题'}
                                                                    </span>
                                                                    {question.aiGenerated && (
                                                                        <span className="text-xs bg-purple-100 text-purple-600 px-2 py-0.5 rounded flex items-center gap-1">
                                                                            <Icon name="Sparkles" size={10} />
                                                                            AI生成
                                                                        </span>
                                                                    )}
                                                                </div>
                                                                <button
                                                                    onClick={() => removeQuestion(question.id)}
                                                                    className="p-1 text-slate-400 hover:text-red-500"
                                                                >
                                                                    <Icon name="Trash2" size={14} />
                                                                </button>
                                                            </div>

                                                            <textarea
                                                                value={question.content}
                                                                onChange={(e) => updateQuestion(question.id, 'content', e.target.value)}
                                                                placeholder="输入题目内容..."
                                                                className="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none resize-none"
                                                                rows={2}
                                                            />

                                                            {question.type === 'choice' && (
                                                                <div className="mt-3 space-y-2">
                                                                    {question.options.map((opt, optIdx) => (
                                                                        <div key={optIdx} className="flex items-center gap-2">
                                                                            <input
                                                                                type="radio"
                                                                                name={`answer_${question.id}`}
                                                                                checked={question.answer === optIdx}
                                                                                onChange={() => updateQuestion(question.id, 'answer', optIdx)}
                                                                                className="w-4 h-4 text-green-600"
                                                                            />
                                                                            <input
                                                                                type="text"
                                                                                value={opt}
                                                                                onChange={(e) => {
                                                                                    const newOptions = [...question.options];
                                                                                    newOptions[optIdx] = e.target.value;
                                                                                    updateQuestion(question.id, 'options', newOptions);
                                                                                }}
                                                                                className="flex-1 bg-white border border-slate-200 rounded px-2 py-1 text-sm focus:ring-1 focus:ring-amber-500 outline-none"
                                                                            />
                                                                            {question.answer === optIdx && (
                                                                                <span className="text-xs text-green-600 font-medium">正确答案</span>
                                                                            )}
                                                                        </div>
                                                                    ))}
                                                                </div>
                                                            )}

                                                            {question.type === 'fillblank' && (
                                                                <div className="mt-3">
                                                                    <label className="block text-xs text-slate-500 mb-1">参考答案</label>
                                                                    <input
                                                                        type="text"
                                                                        value={question.answer}
                                                                        onChange={(e) => updateQuestion(question.id, 'answer', e.target.value)}
                                                                        className="w-full bg-white border border-slate-200 rounded px-3 py-2 text-sm focus:ring-1 focus:ring-amber-500 outline-none"
                                                                    />
                                                                </div>
                                                            )}

                                                            {question.type === 'truefalse' && (
                                                                <div className="mt-3">
                                                                    <label className="block text-xs text-slate-500 mb-2">正确答案</label>
                                                                    <div className="flex gap-3">
                                                                        <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-lg cursor-pointer transition-all ${
                                                                            question.answer === true ? 'bg-green-100 border-2 border-green-500' : 'bg-white border-2 border-slate-200 hover:border-green-300'
                                                                        }`}>
                                                                            <input
                                                                                type="radio"
                                                                                name={`answer_${question.id}`}
                                                                                checked={question.answer === true}
                                                                                onChange={() => updateQuestion(question.id, 'answer', true)}
                                                                                className="hidden"
                                                                            />
                                                                            <Icon name="Check" size={16} className={question.answer === true ? 'text-green-600' : 'text-slate-400'} />
                                                                            <span className={`text-sm font-medium ${question.answer === true ? 'text-green-700' : 'text-slate-600'}`}>正确</span>
                                                                        </label>
                                                                        <label className={`flex-1 flex items-center justify-center gap-2 p-3 rounded-lg cursor-pointer transition-all ${
                                                                            question.answer === false ? 'bg-red-100 border-2 border-red-500' : 'bg-white border-2 border-slate-200 hover:border-red-300'
                                                                        }`}>
                                                                            <input
                                                                                type="radio"
                                                                                name={`answer_${question.id}`}
                                                                                checked={question.answer === false}
                                                                                onChange={() => updateQuestion(question.id, 'answer', false)}
                                                                                className="hidden"
                                                                            />
                                                                            <Icon name="X" size={16} className={question.answer === false ? 'text-red-600' : 'text-slate-400'} />
                                                                            <span className={`text-sm font-medium ${question.answer === false ? 'text-red-700' : 'text-slate-600'}`}>错误</span>
                                                                        </label>
                                                                    </div>
                                                                </div>
                                                            )}

                                                            {question.type === 'shortanswer' && (
                                                                <div className="mt-3">
                                                                    <label className="block text-xs text-slate-500 mb-1">参考答案/评分要点</label>
                                                                    <textarea
                                                                        value={question.answer}
                                                                        onChange={(e) => updateQuestion(question.id, 'answer', e.target.value)}
                                                                        placeholder="输入参考答案或评分要点..."
                                                                        className="w-full bg-white border border-slate-200 rounded px-3 py-2 text-sm focus:ring-1 focus:ring-amber-500 outline-none resize-none"
                                                                        rows={3}
                                                                    />
                                                                </div>
                                                            )}
                                                        </div>
                                                    ))}
                                                </div>

                                                {/* 手动添加题目 */}
                                                <div className="grid grid-cols-2 gap-2">
                                                    <button
                                                        onClick={() => addQuestion('choice')}
                                                        className="py-2 border border-dashed border-blue-300 rounded-lg text-blue-600 hover:bg-blue-50 text-xs flex items-center justify-center gap-1"
                                                    >
                                                        <Icon name="Plus" size={12} />
                                                        添加选择题
                                                    </button>
                                                    <button
                                                        onClick={() => addQuestion('fillblank')}
                                                        className="py-2 border border-dashed border-amber-300 rounded-lg text-amber-600 hover:bg-amber-50 text-xs flex items-center justify-center gap-1"
                                                    >
                                                        <Icon name="Plus" size={12} />
                                                        添加填空题
                                                    </button>
                                                    <button
                                                        onClick={() => addQuestion('truefalse')}
                                                        className="py-2 border border-dashed border-green-300 rounded-lg text-green-600 hover:bg-green-50 text-xs flex items-center justify-center gap-1"
                                                    >
                                                        <Icon name="Plus" size={12} />
                                                        添加判断题
                                                    </button>
                                                    <button
                                                        onClick={() => addQuestion('shortanswer')}
                                                        className="py-2 border border-dashed border-indigo-300 rounded-lg text-indigo-600 hover:bg-indigo-50 text-xs flex items-center justify-center gap-1"
                                                    >
                                                        <Icon name="Plus" size={12} />
                                                        添加简答题
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {/* 作业设置 */}
                                        {activeTask.type === 'assignment' && (
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-xs font-medium text-slate-600 mb-1">作业提示/要求</label>
                                                    <textarea
                                                        value={activeTask.teacherHint || ''}
                                                        onChange={(e) => updateTask(activeTaskId, 'teacherHint', e.target.value)}
                                                        placeholder="给学生的提示，例如：请结合生活实际，提出至少3条节水建议..."
                                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500 outline-none resize-none"
                                                        rows={3}
                                                    />
                                                </div>
                                                <div className="grid grid-cols-2 gap-4">
                                                    <div>
                                                        <label className="block text-xs font-medium text-slate-600 mb-1">最少字数</label>

        // --- SingleTaskEditModal: 单个任务编辑弹窗 ---
        function SingleTaskEditModal({ task, onSave, onClose }) {
            const [localTask, setLocalTask] = useState({ ...task });
            const [isGenerating, setIsGenerating] = useState(false);

            if (!task) return null;

            const updateField = (field, value) => {
                setLocalTask({ ...localTask, [field]: value });
            };

            // AI生成题目
            const generateQuestions = async () => {
                setIsGenerating(true);
                await new Promise(resolve => setTimeout(resolve, 1200));
                const generatedQuestions = [
                    { id: `q_${Date.now()}_1`, type: 'choice', content: 'AI生成的选择题 1', options: ['选项A', '选项B', '选项C'], answer: 0, aiGenerated: true },
                    { id: `q_${Date.now()}_2`, type: 'choice', content: 'AI生成的选择题 2', options: ['选项A', '选项B', '选项C'], answer: 1, aiGenerated: true },
                    { id: `q_${Date.now()}_3`, type: 'fillblank', content: 'AI生成的填空题: ______', answer: '答案', aiGenerated: true },
                ];
                updateField('questions', generatedQuestions);
                setIsGenerating(false);
            };

            // 更新题目
            const updateQuestion = (questionId, field, value) => {
                const newQuestions = localTask.questions.map(q =>
                    q.id === questionId ? { ...q, [field]: value } : q
                );
                updateField('questions', newQuestions);
            };

            // 删除题目
            const removeQuestion = (questionId) => {
                updateField('questions', localTask.questions.filter(q => q.id !== questionId));
            };

            return (
                <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white w-[650px] max-h-[85vh] rounded-2xl shadow-2xl overflow-hidden animate-zoomIn" onClick={e => e.stopPropagation()}>

                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center">
                                        <Icon name={localTask.type === 'quiz' ? 'Zap' : 'FileEdit'} size={20} />
                                    </div>

                                        <h2 className="text-lg font-bold">
                                            {localTask.type === 'quiz' ? '编辑测验' : '编辑作业'}

                                    <label className="block text-sm font-medium text-slate-700 mb-1">任务标题</label>

                                        type="text"
                                        value={localTask.title}

                                        className="w-full bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>

                                <div className="flex items-center gap-4">
                                    <label className="flex items-center gap-2 cursor-pointer">
                                        <input
                                            type="checkbox"
                                            checked={localTask.status === 'required'}
                                            onChange={(e) => updateField('status', e.target.checked ? 'required' : 'optional')}
                                            className="w-4 h-4 text-red-600 rounded"
                                        />
                                        <span className="text-sm text-slate-600">必修任务</span>
                                    </label>
                                    {localTask.type === 'quiz' && (
                                        <div className="flex items-center gap-2">
                                            <span className="text-sm text-slate-500">及格分:</span>
                                            <input
                                                type="number"
                                                value={localTask.passScore}
                                                onChange={(e) => updateField('passScore', parseInt(e.target.value))}
                                                className="w-16 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-sm text-center"
                                            />
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* 测验题目 */}
                            {localTask.type === 'quiz' && (
                                <div className="mt-6">
                                    <div className="flex items-center justify-between mb-3">
                                        <h3 className="text-sm font-bold text-slate-700 flex items-center gap-2">

                                            {localTask.questions?.length > 0 && (

                                        <button

                                        >
                                            {isGenerating ? (
                                                <>
                                                    <Icon name="Loader2" size={12} className="animate-spin" />
                                                    生成中...
                                                </>
                                            ) : (
                                                <>
                                                    <Icon name="Sparkles" size={12} />
                                                    AI生成题目
                                                </>
                                            )}
                                        </button>
                                    </div>

                                    <div className="space-y-3 max-h-[200px] overflow-y-auto">
                                        {localTask.questions?.map((q, idx) => (
                                            <div key={q.id} className="p-3 bg-slate-50 rounded-lg border border-slate-200">

                                                            <span className="text-xs text-slate-500">

                                                        <Icon name="X" size={14} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                        {(!localTask.questions || localTask.questions.length === 0) && (
                                            <div className="text-center py-6 text-slate-400">
                                                <Icon name="ListChecks" size={24} className="mx-auto mb-2" />
                                                <p className="text-xs">点击"AI生成题目"或手动添加题目</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* 作业配置 */}
                            {localTask.type === 'assignment' && (
                                <div className="mt-6 space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-slate-700 mb-1">作业要求/提示</label>
                                        <textarea
                                            value={localTask.teacherHint || ''}
                                            onChange={(e) => updateField('teacherHint', e.target.value)}

                                            placeholder="请输入作业要求，例如：请结合生活实际，提出至少3条节水建议..."

                                            </label>

                                        {localTask.aiGrading?.enabled && (
                                            <div className="space-y-3">

                                                        value={localTask.aiGrading?.agentId || 'agent_default'}

                                            <div className="flex-1 min-w-0">
                                                <p className="text-sm font-medium text-slate-700">{item.title}</p>
                                                <p className="text-xs text-slate-500 mt-0.5 line-clamp-2">{item.description}</p>
                                                <p className="text-xs text-slate-400 mt-1">
                                                    {item.duration || (item.pages ? `${item.pages}页` : '网页链接')}
                                                </p>
                                            </div>
                                            <div className="opacity-0 group-hover:opacity-100 transition-opacity">
                                                <Icon name="Plus" size={16} className="text-emerald-600" />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="p-4 border-t border-slate-200 bg-slate-50 flex justify-end">
                            <button onClick={onClose} className="px-4 py-2 text-slate-600 hover:text-slate-800">关闭</button>
                        </div>
                    </div>
                </div>
            );
        }

        // Render
        ReactDOM.render(<TeacherConfigApp />, document.getElementById('root'));
    </script>
</body>
</html>
