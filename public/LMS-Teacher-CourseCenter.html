<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS - 课程中心</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- D3.js v7 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8fafc;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar - Apple Style */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(203, 213, 225, 0.5);
            border-radius: 2px;
            transition: background 0.2s ease;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.7); }

        /* Apple Style Shadow System */
        .modern-shadow {
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.04),
                0 2px 4px rgba(0, 0, 0, 0.04),
                0 4px 8px rgba(0, 0, 0, 0.04);
        }
        .modern-shadow-lg {
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.04),
                0 2px 8px rgba(0, 0, 0, 0.04),
                0 8px 16px rgba(0, 0, 0, 0.08),
                0 16px 32px rgba(0, 0, 0, 0.08);
        }

        /* Card Hover Effects - Apple Style with Glow */
        .card-hover {
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow:
                0 10px 25px -5px rgba(99, 102, 241, 0.1),
                0 8px 10px -6px rgba(99, 102, 241, 0.1),
                0 0 0 1px rgba(99, 102, 241, 0.05),
                0 20px 40px rgba(0, 0, 0, 0.08);
        }

        /* Button Hover Effects - Premium Style */
        .btn-hover {
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .btn-hover::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }
        .btn-hover:hover::before {
            left: 100%;
        }
        .btn-hover:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }
        .btn-hover:active {
            transform: scale(0.98);
        }

        /* Animations - Refined */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .animate-fadeIn { animation: fadeIn 0.3s ease-out forwards; }
        .animate-fadeInUp { animation: fadeInUp 0.5s ease-out forwards; }
        .animate-scaleIn { animation: scaleIn 0.3s ease-out forwards; }
        .animate-slideIn { animation: slideIn 0.4s ease-out forwards; }

        /* Network visualization styles */
        .node circle {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .node circle:hover {
            filter: brightness(1.1);
        }
        .node text {
            pointer-events: none;
            font-size: 12px;
            font-weight: 500;
        }
        .node.highlighted circle {
            stroke-width: 4px;
            filter: drop-shadow(0 0 8px currentColor);
        }

        /* Input Focus Enhancement - Apple Style */
        input:focus, select:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.5);
            transition: all 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Glass Morphism Effect */
        .glass-morphism {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ===== TeacherNavBar Component (Inline) =====
        const GraduationCap = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        );

        // 平铺导航配置
        const navigationItems = [
          { id: 'admin', label: '管理中心', icon: 'Settings', href: 'Admin-Dashboard.html' },
          { id: 'teacher', label: '教师中心', icon: 'User', href: 'LMS-Teacher-Home.html' },
          { id: 'course', label: '课程中心', icon: 'LayoutGrid', href: 'LMS-Teacher-CourseCenter.html' },
          { id: 'resource', label: '资源库', icon: 'FileText', href: 'PD-Teacher-Resource-Hub.html' },
          { id: 'workshop', label: '工作坊', icon: 'Clock', href: 'PD-Teacher-Workshop.html' },
        ];

        // 导航图标组件
        const NavIcon = ({ name, className }) => {
          const icons = {
            Settings: (
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            ),
            User: (
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            ),
            LayoutGrid: (
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <rect width="7" height="7" x="3" y="3" rx="1"></rect>
                <rect width="7" height="7" x="14" y="3" rx="1"></rect>
                <rect width="7" height="7" x="14" y="14" rx="1"></rect>
                <rect width="7" height="7" x="3" y="14" rx="1"></rect>
              </svg>
            ),
            FileText: (
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" x2="8" y1="13" y2="13"></line>
                <line x1="16" x2="8" y1="17" y2="17"></line>
                <line x1="10" x2="8" y1="9" y2="9"></line>
              </svg>
            ),
            Clock: (
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
            ),
          };
          return icons[name] || null;
        };

        const TeacherNavBar = ({ currentPage = 'course' }) => {
          return (
            <nav className="h-14 bg-white border-b border-gray-200 shadow-sm sticky top-0 z-50">
              <div className="h-full max-w-7xl mx-auto px-6 flex items-center justify-between">
                {/* Logo */}
                <a href="LMS-Teacher-Home.html" className="flex items-center gap-3 hover:opacity-80 transition-opacity cursor-pointer">
                  <div className="w-9 h-9 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-lg flex items-center justify-center shadow-md">
                    <GraduationCap className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="font-bold text-base text-gray-900">CocoStudy</h1>
                  </div>
                </a>

                {/* 平铺导航 */}
                <div className="flex items-center gap-1">
                  {navigationItems.map((item) => (
                    <a
                      key={item.id}
                      href={item.href}
                      className={`
                        flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium transition-all
                        ${currentPage === item.id
                          ? 'bg-indigo-50 text-indigo-600'
                          : 'text-gray-600 hover:bg-gray-100 hover:text-gray-900'
                        }
                      `}
                    >
                      <NavIcon name={item.icon} />
                      <span>{item.label}</span>
                    </a>
                  ))}
                </div>

                {/* 用户信息 */}
                <div className="flex items-center gap-3">
                  <div className="text-right">
                    <p className="text-sm font-medium text-gray-900">Mo老师</p>
                    <p className="text-xs text-gray-500">高级教师</p>
                  </div>
                  <div className="w-9 h-9 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-md">
                    Mo
                  </div>
                </div>
              </div>
            </nav>
          );
        };
        // ===== End of TeacherNavBar Component =====

        // --- Icon Component ---
        const Icon = ({ name, size = 20, className }) => {
            if (!window.lucide || !window.lucide.icons || !window.lucide.icons[name]) {
                return null;
            }
            try {
                const iconDef = window.lucide.icons[name];
                const svgElement = window.lucide.createElement(iconDef);
                svgElement.setAttribute('width', size);
                svgElement.setAttribute('height', size);
                const baseClass = `lucide lucide-${name}`;
                svgElement.setAttribute('class', className ? `${baseClass} ${className}` : baseClass);
                return <span
                    dangerouslySetInnerHTML={{ __html: svgElement.outerHTML }}
                    style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}
                />;
            } catch (error) {
                console.error(`Failed to render icon: ${name}`, error);
                return null;
            }
        };

        // --- Statistics Card Component ---
        const StatsCard = ({ title, value, icon, color }) => (
            <div className="bg-white rounded-2xl p-6 border border-gray-100 modern-shadow card-hover">
                <div className="flex items-center justify-between">
                    <div>
                        <p className="text-sm text-gray-500 mb-1">{title}</p>
                        <p className="text-3xl font-bold text-gray-900">{value}</p>
                    </div>
                    <div className={`p-3 rounded-xl ${color}`}>
                        <Icon name={icon} size={24} className="text-white" />
                    </div>
                </div>
            </div>
        );

        // --- 模式选择对话框 ---
        const TeachingModeModal = ({ isOpen, onClose, onSelectMode, course }) => {
            if (!isOpen) return null;

            const modes = [
                {
                    id: 'self-learning',
                    title: '自学模式（以学生为中心的课堂模式）',
                    description: '学生在AI虚拟导师的指导下自主学习，教师可监控学习数据',
                    icon: 'BookOpen',
                    color: 'emerald',
                    targetPage: '/LMS-Teacher-NoteConfig.html',
                    defaultView: 'use' // 自学模式默认使用视角
                },
                {
                    id: 'lecture',
                    title: '讲授模式（以教师为中心的课堂模式）',
                    description: '教师主导课堂，学生跟随教师的教学节奏',
                    icon: 'Presentation',
                    color: 'blue',
                    targetPage: '/LMS-Teacher-Teaching.html',
                    defaultView: null
                }
            ];

            return (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl overflow-hidden w-[600px] animate-fadeIn" onClick={e => e.stopPropagation()}>
                        {/* Header */}
                        <div className="bg-gradient-to-r from-indigo-500 to-purple-600 text-white p-6">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h2 className="text-xl font-bold mb-1">选择授课模式</h2>
                                    <p className="text-sm text-indigo-100">{course?.title || '课程'}</p>
                                </div>
                                <button
                                    onClick={onClose}
                                    className="p-2 hover:bg-white/20 rounded-lg transition-colors"
                                >
                                    <Icon name="X" size={20} />
                                </button>
                            </div>
                        </div>

                        {/* Mode Options */}
                        <div className="p-6 space-y-4">
                            {modes.map((mode) => (
                                <button
                                    key={mode.id}
                                    onClick={() => onSelectMode(mode)}
                                    className="w-full text-left p-5 border-2 border-slate-200 rounded-xl hover:border-indigo-500 hover:bg-indigo-50/50 transition-all group"
                                >
                                    <div className="flex items-start gap-4">
                                        <div className={`w-12 h-12 bg-${mode.color}-100 rounded-xl flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform`}>
                                            <Icon name={mode.icon} size={24} className={`text-${mode.color}-600`} />
                                        </div>
                                        <div className="flex-1">
                                            <h3 className="text-lg font-bold text-slate-800 mb-1">{mode.title}</h3>
                                            <p className="text-sm text-slate-600">{mode.description}</p>
                                        </div>
                                        <Icon name="ChevronRight" size={20} className="text-slate-400 group-hover:text-indigo-600 group-hover:translate-x-1 transition-all" />
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Course Card Component ---
        const CourseCard = ({ course, onTeachClick }) => (
            <div className="bg-white rounded-2xl border border-gray-100 overflow-hidden modern-shadow card-hover group animate-fadeIn">
                <div className="h-40 relative overflow-hidden bg-gray-100">
                    <img
                        src={course.coverImage}
                        alt={course.title}
                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out"
                        onError={(e) => {
                            e.target.style.display = 'none';
                            e.target.parentElement.classList.add('bg-slate-200');
                        }}
                    />
                    <div className="absolute top-3 right-3 px-2.5 py-1 bg-white/90 backdrop-blur-sm rounded-full text-xs font-medium text-gray-700 shadow-sm">
                        {course.source}
                    </div>
                </div>
                <div className="p-5">
                    <h3 className="font-bold text-lg text-gray-900 mb-2 line-clamp-2 group-hover:text-indigo-600 transition-colors duration-300">
                        {course.title}
                    </h3>

                    {/* Subject Tags */}
                    <div className="flex flex-wrap gap-1.5 mb-3">
                        {course.subjects.map((subject, idx) => (
                            <span key={idx} className={`px-2.5 py-1 rounded-full text-xs font-medium ${subject.color}`}>
                                {subject.name}
                            </span>
                        ))}
                    </div>

                    {/* Knowledge Points */}
                    <div className="mb-4">
                        <div className="flex flex-wrap gap-1">
                            {course.concepts.slice(0, 4).map((concept, idx) => (
                                <span key={idx} className="px-2 py-0.5 bg-gray-50 text-gray-600 text-xs rounded-lg">
                                    {concept}
                                </span>
                            ))}
                            {course.concepts.length > 4 && (
                                <span className="px-2 py-0.5 bg-gray-50 text-gray-500 text-xs rounded-lg">
                                    +{course.concepts.length - 4}
                                </span>
                            )}
                        </div>
                    </div>

                    {/* Stats */}
                    <div className="flex items-center gap-4 text-xs text-gray-500 mb-4">
                        <div className="flex items-center gap-1">
                            <Icon name="Users" size={14} />
                            <span>{course.students}人学习</span>
                        </div>
                        <div className="flex items-center gap-1">
                            <Icon name="Star" size={14} className="fill-yellow-400 text-yellow-400" />
                            <span>{course.rating}</span>
                        </div>
                    </div>

                    {/* Action Button */}
                    <button
                        onClick={() => onTeachClick(course)}
                        className="w-full py-3 bg-indigo-600 text-white rounded-xl font-medium btn-hover flex items-center justify-center gap-2">
                        <Icon name="PlayCircle" size={18} />
                        去授课
                    </button>
                </div>
            </div>
        );

        // --- Network Visualization Component ---
        const NetworkVisualization = ({ selectedSubject, linkStrength, showLabels, showConnections, showClusters, courses, onNodeClick }) => {
            const svgRef = useRef(null);
            const [selectedNode, setSelectedNode] = useState(null);

            useEffect(() => {
                if (!svgRef.current) return;

                // Clear previous visualization
                d3.select(svgRef.current).selectAll("*").remove();

                const width = svgRef.current.clientWidth;
                const height = 600;

                // Three-tier knowledge network structure
                // Tier 1: Big Concepts (跨学科大概念)
                // Tier 2: Subject Concepts (学科概念)
                // Tier 3: Sub Concepts (学科子概念)
                const nodes = [
                    // Tier 1: Big Concepts (跨学科大概念)
                    { id: "system-balance", label: "系统与平衡", tier: 1, color: "#6366f1", value: 30 },
                    { id: "structure-function", label: "结构与功能", tier: 1, color: "#8b5cf6", value: 28 },
                    { id: "cause-effect", label: "因果关系", tier: 1, color: "#ec4899", value: 26 },
                    { id: "pattern", label: "模式", tier: 1, color: "#f59e0b", value: 25 },
                    { id: "change-development", label: "变化与发展", tier: 1, color: "#10b981", value: 24 },
                    { id: "diversity", label: "多样性", tier: 1, color: "#06b6d4", value: 22 },

                    // Tier 2: Subject Concepts (学科概念)
                    { id: "ecosystem", label: "生态系统", tier: 2, color: "#6366f1", value: 16 },
                    { id: "water-cycle", label: "水循环", tier: 2, color: "#6366f1", value: 14 },
                    { id: "sustainable-dev", label: "可持续发展", tier: 2, color: "#6366f1", value: 15 },
                    { id: "mechanics", label: "力学原理", tier: 2, color: "#8b5cf6", value: 14 },
                    { id: "light-color", label: "光的传播", tier: 2, color: "#8b5cf6", value: 13 },
                    { id: "sound-wave", label: "声波传播", tier: 2, color: "#8b5cf6", value: 12 },
                    { id: "material-property", label: "材料性质", tier: 2, color: "#8b5cf6", value: 13 },
                    { id: "statistics", label: "统计分析", tier: 2, color: "#ec4899", value: 14 },
                    { id: "historical-event", label: "历史事件", tier: 2, color: "#ec4899", value: 13 },
                    { id: "rhythm", label: "节奏模式", tier: 2, color: "#f59e0b", value: 12 },
                    { id: "geometry-shape", label: "几何形状", tier: 2, color: "#f59e0b", value: 13 },
                    { id: "algorithm", label: "算法思维", tier: 2, color: "#f59e0b", value: 14 },
                    { id: "climate-system", label: "气候系统", tier: 2, color: "#10b981", value: 13 },
                    { id: "plant-growth", label: "植物生理", tier: 2, color: "#10b981", value: 12 },
                    { id: "cultural-heritage", label: "文化传承", tier: 2, color: "#06b6d4", value: 13 },
                    { id: "music-form", label: "音乐形式", tier: 2, color: "#06b6d4", value: 11 },

                    // Tier 3: Sub Concepts (学科子概念)
                    { id: "biodiversity", label: "生物多样性", tier: 3, color: "#6366f1", value: 8 },
                    { id: "food-chain", label: "食物链", tier: 3, color: "#6366f1", value: 8 },
                    { id: "energy-flow", label: "能量转化", tier: 3, color: "#6366f1", value: 8 },
                    { id: "color-theory", label: "色彩理论", tier: 3, color: "#8b5cf6", value: 7 },
                    { id: "frequency", label: "频率振动", tier: 3, color: "#8b5cf6", value: 7 },
                    { id: "data-vis", label: "数据可视化", tier: 3, color: "#ec4899", value: 8 },
                    { id: "social-impact", label: "社会影响", tier: 3, color: "#ec4899", value: 7 },
                    { id: "symmetry", label: "对称性", tier: 3, color: "#f59e0b", value: 7 },
                    { id: "spatial-relation", label: "空间关系", tier: 3, color: "#f59e0b", value: 7 },
                    { id: "logic-reasoning", label: "逻辑推理", tier: 3, color: "#f59e0b", value: 8 },
                    { id: "photosynthesis", label: "光合作用", tier: 3, color: "#10b981", value: 7 },
                    { id: "folk-custom", label: "民俗习惯", tier: 3, color: "#06b6d4", value: 7 },
                ];

                const links = [
                    // Big Concept -> Subject Concept

                    );
                    const nodeIds = new Set(filteredNodes.map(n => n.id));
                    filteredLinks = links.filter(l =>
                        nodeIds.has(typeof l.source === 'object' ? l.source.id : l.source) &&
                        nodeIds.has(typeof l.target === 'object' ? l.target.id : l.target)
                    );
                }

                // Filter by link strength
                filteredLinks = filteredLinks.filter(l => l.strength >= linkStrength / 100);

                const svg = d3.select(svgRef.current)
                    .attr("width", width)
                    .attr("height", height)
                    .attr("viewBox", [0, 0, width, height]);

                // Add zoom behavior
                const g = svg.append("g");
                svg.call(d3.zoom()
                    .extent([[0, 0], [width, height]])
                    .scaleExtent([0.5, 3])
                    .on("zoom", (event) => {
                        g.attr("transform", event.transform);
                    }));

                // Create force simulation
                const simulation = d3.forceSimulation(filteredNodes)
                    .force("link", d3.forceLink(filteredLinks).id(d => d.id).distance(d => 100 / d.strength))

                    .force("center", d3.forceCenter(width / 2, height / 2))
                    .force("collision", d3.forceCollide().radius(d => d.value * 2));

                // Draw links
                const link = g.append("g")
                    .selectAll("line")
                    .data(filteredLinks)
                    .join("line")
                    .attr("class", d => `link ${d.type}`)

                    .attr("stroke-width", d => d.type === "hierarchy" ? 2 : 1.5)
                    .attr("stroke-dasharray", d => d.type === "related" ? "5,5" : "0")
                    .attr("stroke-opacity", 0.6)
                    .style("display", showConnections ? "block" : "none");

                // Draw nodes
                const node = g.append("g")
                    .selectAll("g")
                    .data(filteredNodes)
                    .join("g")
                    .attr("class", "node")
                    .call(d3.drag()
                        .on("start", dragstarted)
                        .on("drag", dragged)
                        .on("end", dragended));

                    .attr("fill", d => d.color)

                        // Trigger course filtering

                // Add labels
                node.append("text")
                    .text(d => d.label)
                    .attr("dy", d => d.value + 15)
                    .attr("text-anchor", "middle")
                    .attr("fill", "#374151")
                    .style("display", showLabels ? "block" : "none");

                // Update positions on simulation tick
                simulation.on("tick", () => {
                    link
                        .attr("x1", d => d.source.x)
                        .attr("y1", d => d.source.y)
                        .attr("x2", d => d.target.x)
                        .attr("y2", d => d.target.y);

                    node.attr("transform", d => `translate(${d.x},${d.y})`);
                });

                // Drag functions
                function dragstarted(event) {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    event.subject.fx = event.subject.x;
                    event.subject.fy = event.subject.y;
                }

                function dragged(event) {
                    event.subject.fx = event.x;
                    event.subject.fy = event.y;
                }

                function dragended(event) {
                    if (!event.active) simulation.alphaTarget(0);
                    event.subject.fx = null;
                    event.subject.fy = null;
                }
