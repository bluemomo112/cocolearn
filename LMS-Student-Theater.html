troke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg><p class="text-gray-600 mb-1">点击上传或拖拽文件到此处</p><p class="text-xs text-gray-400">支持 PDF、Word 格式，最大 10MB</p></div></div><button class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition-colors shadow-lg">提交作业</button></div></div></div>'

        // 主应用组件
        function TheaterApp() {
            // 从教师端同步的状态
            const [aiEnabled, setAiEnabled] = useState(false);
            const [aiPersona, setAiPersona] = useState('socratic'); // socratic, wiki, etc
            const [currentResource, setCurrentResource] = useState('video');
            const [isLocked, setIsLocked] = useState(false);

            // 本地状态
            const [chatMessages, setChatMessages] = useState([]);
            const [inputMessage, setInputMessage] = useState('');

            // 使用 refs 来跟踪上一次的 localStorage 值，避免无限循环
            const prevValuesRef = useRef({
                aiEnabled: null,
                aiPersona: null,
                currentResource: null,
                lockScreen: null
            });

            // 清理旧的交互数据并初始化演示数据
            useEffect(() => {
                // 页面加载时清理学生端遗留数据，避免误触发
                localStorage.removeItem('teacher_push_interactive');
                localStorage.removeItem('student_answers');
                localStorage.removeItem('student_warning');

                // 初始化默认状态（如果教师端还未设置）
                if (!localStorage.getItem('teacher_current_resource')) {
                    localStorage.setItem('teacher_current_resource', 'video');
                }
                if (!localStorage.getItem('teacher_ai_enabled')) {
                    localStorage.setItem('teacher_ai_enabled', 'false');
                }
                if (!localStorage.getItem('teacher_lock_screen')) {
                    localStorage.setItem('teacher_lock_screen', 'false');
                }

                // 设置当前页面为跟随模式（theater）
                localStorage.setItem('teacher_learning_mode', 'theater');

                console.log('[学生端-跟随模式] 初始化完成，等待教师端控制...');
            }, []);

            // 监听教师端的模式切换命令
            useEffect(() => {
                let lastTimestamp = localStorage.getItem('teacher_mode_change_timestamp') || '0';

                const checkModeChange = () => {
                    const currentTimestamp = localStorage.getItem('teacher_mode_change_timestamp') || '0';
                    const currentMode = localStorage.getItem('teacher_learning_mode');

                    // 检测到新的模式切换命令
                    if (currentTimestamp !== lastTimestamp && currentMode === 'workbench') {
                        lastTimestamp = currentTimestamp;
                        console.log('[学生端-跟随模式] 收到教师端指令，正在切换到自学模式...');
                        // 跳转到自学模式页面
                        window.location.href = 'LMS-Student-Workbench.html';
                    }
                };

                // 每500ms检查一次
                const interval = setInterval(checkModeChange, 500);
                return () => clearInterval(interval);
            }, []);

            // 轮询教师端状态
            useEffect(() => {
                // 轮询教师端命令
                const pollTeacherCommands = () => {
                    try {
                        // 读取教师端的控制命令
                        const aiState = localStorage.getItem('teacher_ai_enabled');
                        const aiPersonaState = localStorage.getItem('teacher_ai_persona');
                        const resourceState = localStorage.getItem('teacher_current_resource');
                        const lockState = localStorage.getItem('teacher_lock_screen');

                        // 同步AI开关（只在值真正变化时更新）
                        if (aiState !== null && aiState !== prevValuesRef.current.aiEnabled) {
                            prevValuesRef.current.aiEnabled = aiState;
                            const enabled = aiState === 'true';
                            setAiEnabled(enabled);

                            // 如果是首次开启AI，添加欢迎消息
                            if (enabled) {
                                setChatMessages(prev => {
                                    if (prev.length === 0) {
                                        return [{
                                            role: 'assistant',
                                            content: getPersonaWelcomeMessage(aiPersonaState || 'socratic'),
                                            timestamp: new Date()
                                        }];
                                    }
                                    return prev;
                                });
                            }
                        }

                        // 同步AI人格（只在值真正变化时更新）
                        if (aiPersonaState && aiPersonaState !== prevValuesRef.current.aiPersona) {
                            prevValuesRef.current.aiPersona = aiPersonaState;
                            setAiPersona(aiPersonaState);

                            // 添加系统消息通知人格切换
                            setChatMessages(prev => {
                                // 避免重复添加相同的系统消息
                                const lastMsg = prev[prev.length - 1];
                                if (lastMsg?.role === 'system' && lastMsg?.content?.includes('AI助手已切换')) {
                                    return prev;
                                }
                                return [...prev, {
                                    role: 'system',
                                    content: `AI助手已切换到：${getPersonaName(aiPersonaState)}`,
                                    timestamp: new Date()
                                }];
                            });
                        }

                        // 同步资源（只在值真正变化时更新）
                        if (resourceState && resourceState !== prevValuesRef.current.currentResource) {
                            prevValuesRef.current.currentResource = resourceState;
                            setCurrentResource(resourceState);
                            console.log('[学生端] 资源切换:', resourceState);
                        }

                        // 同步锁屏状态（只在值真正变化时更新）
                        if (lockState !== null && lockState !== prevValuesRef.current.lockScreen) {
                            prevValuesRef.current.lockScreen = lockState;
                            setIsLocked(lockState === 'true');
                        }
                    } catch (e) {
                        console.error('轮询错误:', e);
                    }
                };

                // 立即执行一次
                pollTeacherCommands();

                // 每500ms轮询一次
                const interval = setInterval(pollTeacherCommands, 500);

                return () => clearInterval(interval);
            }, []); // 空依赖数组 - 只在组件挂载时运行一次

            // 获取人格欢迎消息
            const getPersonaWelcomeMessage = (persona) => {
                const messages = {
                    'socratic': '你好！我是你的学习助手（苏格拉底模式）。我会通过提问引导你思考，而不是直接给出答案。有什么问题可以随时问我。',
                    'wiki': '你好！我是你的百科助手。我会简洁准确地回答你的事实性问题。',
                    'metacognitive': '你好！我是你的元认知导师。我会帮助你反思学习过程，提升学习策略。'
                };
                return messages[persona] || messages['socratic'];
            };

            // 获取人格名称
            const getPersonaName = (persona) => {
                const names = {
                    'socratic': '苏格拉底导师',
                    'wiki': '百科助手',
                    'metacognitive': '元认知导师'
                };
                return names[persona] || '苏格拉底导师';
            };

            // 发送消息
            const sendMessage = () => {
                if (!inputMessage.trim()) return;

                const newMessage = { role: 'user', content: inputMessage, timestamp: new Date() };
                setChatMessages([...chatMessages, newMessage]);
                setInputMessage('');

                // 模拟AI回复（根据人格不同）
                setTimeout(() => {
                    const response = generatePersonaResponse(inputMessage, aiPersona);
                    setChatMessages(prev => [...prev, { role: 'assistant', content: response, timestamp: new Date() }]);
                }, 1000);
            };

            // 根据人格生成响应
            const generatePersonaResponse = (question, persona) => {
                const lowerQ = question.toLowerCase();

                if (persona === 'socratic') {
                    // 苏格拉底模式：引导提问
                    if (lowerQ.includes('答案') || lowerQ.includes('是什么')) {
                        return '这是一个很好的问题！在回答之前，让我们先思考一下：你觉得视频中提到的哪个部分可能与这个问题相关？';
                    } else if (lowerQ.includes('不懂') || lowerQ.includes('难')) {
                        return '我理解学习过程中遇到困难是很正常的。能告诉我具体是哪个概念让你感到困惑吗？我们可以一步步来梳理。';
                    } else {
                        return '很好的思考！基于视频内容，你能尝试用自己的话解释一下你的理解吗？';
                    }
                } else if (persona === 'wiki') {
                    // 百科模式：简短回答
                    if (lowerQ.includes('水循环')) {
                        return '水循环是指水从地表蒸发到大气，凝结成云，最后以降水形式回到地表的自然过程。主要包括：蒸发、凝结、降水三个阶段。';
                    } else {
                        return '这个问题涉及的概念在课件的第3页有详细说明，你可以查看那部分内容。';
                    }
                } else {
                    // 元认知模式
                    return '我注意到你在这个问题上停留了较长时间。让我们先回顾一下：你之前理解了哪些相关概念？这可以帮助我们更好地解决当前的问题。';
                }
            };

            return (
                <div className="h-screen flex flex-col relative kiosk-mode bg-white">
                    {/* 顶部状态栏 */}
                    <header className="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 shrink-0 z-30 shadow-sm">
                        <div className="flex items-center gap-3">
                            <div className="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md">K</div>
                            <div>
                                <h1 className="font-semibold text-base text-gray-800">跨学科探究：水资源与环境</h1>
                                <div className="flex items-center gap-2 text-xs text-gray-500">
                                    <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                                    正在上课 · 跟随模式
                                </div>
                            </div>
                        </div>

                        <div className="flex items-center gap-4">
                            {aiEnabled && (
                                <div className="flex items-center gap-2 text-xs text-green-600 bg-green-50 px-3 py-1.5 rounded-full">
                                    <i data-lucide="sparkles" className="w-3.5 h-3.5"></i>
                                    AI助手：{getPersonaName(aiPersona)}
                                </div>
                            )}
                            <div className="text-xs text-gray-400 bg-gray-50 px-3 py-1.5 rounded-full">
                                由教师控制
                            </div>
                        </div>
                    </header>

                    {/* 主内容区 */}
                    <div className="flex-1 flex overflow-hidden relative bg-gray-50">
                        {/* 主舞台区域 */}
                        <main className={`flex-1 flex flex-col bg-white relative transition-all duration-300 ${aiEnabled ? '' : 'w-full'}`}>
                            {isLocked ? (
                                <LockedScreen />
                            ) : (
                                <ResourceDisplay resource={currentResource} />
                            )}
                        </main>

                        {/* AI助手侧边栏 */}
                        {aiEnabled && (
                            <aside className="w-96 bg-white border-l border-gray-200 flex flex-col slide-in-right shadow-lg">
                                <AIChatPanel
                                    messages={chatMessages}
                                    inputMessage={inputMessage}
                                    setInputMessage={setInputMessage}
                                    sendMessage={sendMessage}
                                    persona={aiPersona}
                                />
                            </aside>
                        )}
                    </div>
                </div>
            );
        }

        // 资源显示组件（重构版 - 直接显示教师端内容）
        function ResourceDisplay({ resource }) {
            useEffect(() => {
                // 延迟初始化图标
                const timer = setTimeout(() => {
                    lucide.createIcons();
                }, 100);
                return () => clearTimeout(timer);
            }, [resource]);

            // 获取对应资源的HTML内容，默认显示video
            const htmlContent = RESOURCES_CONTENT[resource] || RESOURCES_CONTENT['video'];

            return (
                <div
                    className="flex-1 overflow-auto"
                    dangerouslySetInnerHTML={{ __html: htmlContent }}
                />
            );
        }

        // 锁屏组件
        function LockedScreen() {
            const containerRef = useRef(null);

            useEffect(() => {
                // 延迟初始化图标，避免DOM冲突
                const timer = setTimeout(() => {
                    if (containerRef.current) {
                        lucide.createIcons({ nameAttr: 'data-lucide', attrs: {} }, containerRef.current);
                    }
                }, 50);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div ref={containerRef} className="flex-1 flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100">
                    <div className="text-center">
                        <div className="w-24 h-24 bg-white rounded-2xl shadow-xl flex items-center justify-center mx-auto mb-6 border-2 border-gray-300">
                            <i data-lucide="lock" className="w-12 h-12 text-gray-500"></i>
                        </div>
                        <p className="text-gray-800 text-xl font-semibold mb-2">屏幕已锁定</p>
                        <p className="text-gray-500 text-sm">请等待教师解锁</p>
                    </div>
                </div>
            );
        }

        // AI聊天面板组件
        function AIChatPanel({ messages, inputMessage, setInputMessage, sendMessage, persona }) {
            const messagesEndRef = useRef(null);
            const containerRef = useRef(null);

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            useEffect(() => {
                // 延迟初始化图标，避免DOM冲突
                const timer = setTimeout(() => {
                    if (containerRef.current) {
                        lucide.createIcons({ nameAttr: 'data-lucide', attrs: {} }, containerRef.current);
                    }
                }, 50);
                return () => clearTimeout(timer);
            }, [persona]);

            const handleKeyPress = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            };

            const getPersonaIcon = () => {
                const icons = {
                    'socratic': 'brain-circuit',
                    'wiki': 'book-open',
                    'metacognitive': 'brain'
                };
                return icons[persona] || 'brain-circuit';
            };

            return (
                <div ref={containerRef} className="ai-sidebar-container">
                    <div className="p-5 border-b border-gray-200 bg-gradient-to-r from-indigo-50 to-purple-50 shrink-0">
                        <div className="flex items-center gap-2 text-gray-800 mb-1">
                            <i data-lucide={getPersonaIcon()} className="w-5 h-5 text-indigo-600"></i>
                            <h2 className="font-bold text-base">AI 学习助手</h2>
                        </div>
                        <p className="text-xs text-gray-600 pl-7">由教师配置 · 当前模式：{persona === 'socratic' ? '苏格拉底' : persona === 'wiki' ? '百科' : '元认知'}</p>
                    </div>

                    <div className="ai-chat-messages p-4 space-y-3 bg-gray-50">
                        {messages.map((msg, idx) => (
                            <div key={idx} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} fade-in`}>
                                <div className={`max-w-[85%] rounded-xl px-4 py-2.5 shadow-sm ${
                                    msg.role === 'user'
                                        ? 'bg-blue-600 text-white'
                                        : msg.role === 'system'
                                        ? 'bg-yellow-50 text-yellow-800 border border-yellow-200'
                                        : 'bg-white text-gray-800 border border-gray-200'
                                }`}>
                                    <p className="text-sm leading-relaxed">{msg.content}</p>
                                    <p className="text-xs opacity-60 mt-1">
                                        {msg.timestamp.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}
                                    </p>
                                </div>
                            </div>

                        <div ref={messagesEndRef} />
                    </div>

                    <div className="p-4 border-t border-gray-200 bg-white shrink-0">
                        <div className="flex gap-2 mb-2">
                            <input
                                type="text"
                                value={inputMessage}
                                onChange={(e) => setInputMessage(e.target.value)}
                                onKeyPress={handleKeyPress}
                                placeholder="有问题随时问我..."
                                className="flex-1 bg-gray-50 text-gray-800 text-sm px-4 py-2.5 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 border border-gray-300"
                            />
                            <button
                                onClick={sendMessage}
                                className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg transition-colors flex items-center gap-2 shadow-md"
                            >
                                <i data-lucide="send" className="w-4 h-4"></i>
                            </button>
                        </div>
                        <p className="text-xs text-gray-500 flex items-center gap-1">
                            <i data-lucide="info" className="w-3 h-3"></i>
                            AI只能回答课程相关问题
                        </p>
                    </div>
                </div>
            );
        }

        // 互动模态框组件
        function InteractiveModal({ data, onSubmit, onClose }) {
            const [answers, setAnswers] = useState({});
            const containerRef = useRef(null);

            useEffect(() => {
                // 延迟初始化图标，避免DOM冲突
                const timer = setTimeout(() => {
                    if (containerRef.current) {
                        lucide.createIcons({ nameAttr: 'data-lucide', attrs: {} }, containerRef.current);
                    }
                }, 50);
                return () => clearTimeout(timer);
            }, []);

            const handleSubmit = () => {
                onSubmit(answers);
            };

            const updateAnswer = (questionId, value) => {
                setAnswers({ ...answers, [questionId]: value });
            };

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center modal-backdrop bg-black/70 backdrop-blur-sm">
                    <div ref={containerRef} className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden modal-content">
                        <div className="p-6 border-b border-gray-200 bg-gradient-to-r from-blue-50 to-indigo-50">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2">
                                        <span className="bg-green-500 text-white px-2 py-1 rounded text-sm">教师推送</span>
                                        {data.title}
                                    </h2>
                                    <p className="text-sm text-gray-600 mt-1">请认真作答，教师将实时查看结果</p>
                                </div>
                            </div>
                        </div>

                        <div className="p-6 overflow-y-auto max-h-[calc(90vh-200px)] space-y-6">
                            {data.questions.map((q, idx) => (
                                <div key={q.id} className="bg-gray-50 rounded-xl p-5 border border-gray-200">
                                    <h3 className="font-bold text-gray-800 mb-4 flex items-start gap-2">
                                        <span className="bg-blue-600 text-white w-6 h-6 rounded-full flex items-center justify-center text-sm shrink-0">
                                            {idx + 1}
                                        </span>
                                        <span className="flex-1">{q.question}</span>
                                    </h3>

                                    {q.type === 'multiple' && (
                                        <div className="space-y-2 ml-8">
                                            {q.options.map((option, optIdx) => (
                                                <label key={optIdx} className="flex items-center gap-3 p-3 bg-white rounded-lg border border-gray-200 hover:border-blue-300 hover:bg-blue-50 cursor-pointer transition-all">
                                                    <input
                                                        type="radio"
                                                        name={`question-${q.id}`}
                                                        value={optIdx}
                                                        onChange={() => updateAnswer(q.id, optIdx)}
                                                        className="w-4 h-4 text-blue-600"
                                                    />
                                                    <span className="text-gray-700">{option}</span>
                                                </label>
                                            ))}
                                        </div>
                                    )}

                                    {q.type === 'text' && (
                                        <div className="ml-8">
                                            <textarea
                                                placeholder={q.placeholder}
                                                onChange={(e) => updateAnswer(q.id, e.target.value)}
                                                className="w-full bg-white border border-gray-300 rounded-lg p-3 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 min-h-[100px]"
                                            />
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>

                        <div className="p-6 border-t border-gray-200 bg-gray-50 flex justify-end gap-3">
                            <button
                                onClick={handleSubmit}
                                className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium transition-colors flex items-center gap-2 shadow-lg shadow-blue-600/30"
                            >
                                <i data-lucide="check" className="w-4 h-4"></i>
                                提交答案
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // 渲染应用
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TheaterApp />);

        // 防止切屏（模拟Kiosk模式）
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.warn('检测到切屏行为');
                // 向教师端发送警告
                localStorage.setItem('student_warning', JSON.stringify({
                    studentId: 'student_001',
                    type: 'screen_switch',
                    timestamp: Date.now()
                }));
            }
        });

        // 禁用右键菜单
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
